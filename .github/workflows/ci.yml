name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default
permissions:
  contents: read

jobs:
  build-linux-gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ccache
      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gcc-${{ github.sha }}
          restore-keys: ccache-gcc-
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build -j
      - name: ccache stats
        run: ccache -s
      - name: Smoke test
        run: |
          ./build/float_inf_walk 0 -m fp32 -t 5
          ./build/float_inf_walk 0 -m fp16 -t 5
          ./build/float_inf_walk 0 -m dec32 -t 5 -q
          ./build/float_inf_walk 0 -m all --only fp32,fp64,dec32 -j 1 -t 5 -q

  build-linux-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ccache
      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-clang-${{ github.sha }}
          restore-keys: ccache-clang-
      - name: Configure
        run: cmake -B build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: ccache stats
        run: ccache -s
      - name: Smoke test
        run: |
          ./build/float_inf_walk 0 -m fp32 -t 5 -q
          ./build/float_inf_walk 0 -m dec64 -t 5 -q

  build-windows-clang:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: >-
            clang
            cmake
            ninja
      - name: Verify compiler (must be clang64, not MSVC)
        run: |
          which clang++
          clang++ --version
          clang++ -dumpmachine
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build -j
      - name: Size red line (fail if exe > 1 MiB)
        run: |
          SIZE=$(stat -c%s build/float_inf_walk.exe)
          echo "float_inf_walk.exe size: $SIZE bytes ($((SIZE/1024)) KB)"
          if [ "$SIZE" -gt 1048576 ]; then
            echo "::error::Binary size $SIZE bytes exceeds 1 MiB red line; a redundant dependency was likely introduced."
            exit 1
          fi
      - name: Smoke test
        run: |
          ./build/float_inf_walk.exe 0 -m fp32 -t 5 -q
          ./build/float_inf_walk.exe 0 -m fp16 -t 5 -q
          ./build/float_inf_walk.exe 0 -m dec32 -t 5 -q
          ./build/float_inf_walk.exe 0 -m all --only fp32,fp64,dec32 -j 1 -t 5 -q
      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: float_inf_walk-windows-clang64
          path: build/float_inf_walk.exe
          retention-days: 14
