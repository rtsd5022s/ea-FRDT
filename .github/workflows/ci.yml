name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y g++ cmake
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Smoke test
        run: |
          ./build/float_inf_walk 0 -m fp32 -t 5
          ./build/float_inf_walk 0 -m fp16 -t 5
          ./build/float_inf_walk 0 -m dec32 -t 5 -q
          ./build/float_inf_walk 0 -m all --only fp32,fp64,dec32 -j 1 -t 5 -q

  build-linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Smoke test
        run: |
          ./build/float_inf_walk 0 -m fp32 -t 5 -q
          ./build/float_inf_walk 0 -m dec64 -t 5 -q

  build-windows-clang:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: >-
            clang
            cmake
            ninja
      - name: Verify compiler (must be clang64, not MSVC)
        run: |
          which clang++
          clang++ --version
          clang++ -dumpmachine
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build -j
      - name: Size red line (fail if exe > 700 KB)
        run: |
          SIZE=$(stat -c%s build/float_inf_walk.exe)
          echo "float_inf_walk.exe size: $SIZE bytes ($((SIZE/1024)) KB)"
          if [ "$SIZE" -gt 716800 ]; then
            echo "::error::Binary size $SIZE bytes exceeds 700 KB red line; a redundant dependency was likely introduced."
            exit 1
          fi
      - name: Smoke test
        run: |
          ./build/float_inf_walk.exe 0 -m fp32 -t 5 -q
          ./build/float_inf_walk.exe 0 -m fp16 -t 5 -q
          ./build/float_inf_walk.exe 0 -m dec32 -t 5 -q
          ./build/float_inf_walk.exe 0 -m all --only fp32,fp64,dec32 -j 1 -t 5 -q
